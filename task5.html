
<!DOCTYPE html>
<html lang="en">
<head>
    <title>Semantic HTML</title>
</head>
<body>

    <header>
        <h1>My Website</h1>
    </header>

    <nav>
        <a href="#home">Home</a>
        <a href="#about">About</a>
    </nav>
    <main>
        <section id="home">
            <h2>Home</h2>
            <p>Welcome to my website.</p>
        </section>
        <section id="about">
            <h2>About</h2>
            <p>I created this page in 5 mins.</p>
        </section>
    </main>
    <footer>
        <p>InternNova 2026</p>
    </footer>

</body>
</html>
